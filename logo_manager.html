<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>电台台标管理</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      min-height: 100vh;
      color: #fff;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 30px;
    }
    .header h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header p {
      color: #aaa;
      font-size: 1.1rem;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
    }
    .stat-value {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .stat-label {
      color: #aaa;
      font-size: 0.9rem;
    }
    .stat-card:nth-child(1) .stat-value { color: #00d4ff; }
    .stat-card:nth-child(2) .stat-value { color: #2ecc71; }
    .stat-card:nth-child(3) .stat-value { color: #e74c3c; }
    .stat-card:nth-child(4) .stat-value { color: #f39c12; }
    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 30px;
    }
    .chart-container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 15px;
      padding: 25px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .chart-container h3 {
      margin-bottom: 20px;
      color: #00d4ff;
    }
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 30px;
    }
    .channel-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: transform 0.3s, box-shadow 0.3s;
      cursor: pointer;
    }
    .channel-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 212, 255, 0.2);
    }
    .channel-card.no-logo {
      border-color: rgba(231, 76, 60, 0.5);
    }
    .channel-card.has-logo {
      border-color: rgba(46, 204, 113, 0.5);
    }
    .channel-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 10px;
      border-radius: 10px;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .channel-icon img, .channel-icon svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .channel-name {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .channel-freq {
      font-size: 0.75rem;
      color: #aaa;
    }
    .filter-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    .filter-tab {
      padding: 10px 25px;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      cursor: pointer;
      transition: all 0.3s;
    }
    .filter-tab:hover, .filter-tab.active {
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      border-color: transparent;
    }
    .search-box {
      width: 100%;
      padding: 15px 20px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      margin-bottom: 20px;
    }
    .search-box::placeholder {
      color: #aaa;
    }
    .progress-bar {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #2ecc71, #00d4ff);
      border-radius: 5px;
      transition: width 0.5s ease;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 20px;
      padding: 30px;
      max-width: 600px;
      width: 90%;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .modal-content h3 {
      margin-bottom: 20px;
      color: #00d4ff;
    }
    .modal-content .detail-icon {
      width: 100px;
      height: 100px;
      margin: 0 auto 20px;
      border-radius: 15px;
      overflow: hidden;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content .detail-icon img, .modal-content .detail-icon svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .detail-label {
      color: #aaa;
    }
    .detail-value {
      color: #fff;
      font-weight: 500;
    }
    .close-btn {
      margin-top: 20px;
      padding: 12px 30px;
      border-radius: 25px;
      background: linear-gradient(90deg, #00d4ff, #7b2fff);
      border: none;
      color: #fff;
      cursor: pointer;
      font-size: 1rem;
      transition: transform 0.3s;
    }
    .close-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📻 电台台标管理</h1>
      <p>实时查看和管理所有电台的台标状态</p>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="totalCount">0</div>
        <div class="stat-label">总电台数</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="hasLogoCount">0</div>
        <div class="stat-label">已有台标</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="noLogoCount">0</div>
        <div class="stat-label">暂无台标</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="coveragePercent">0%</div>
        <div class="stat-label">覆盖率</div>
      </div>
    </div>

    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="charts-row">
      <div class="chart-container">
        <h3>📊 台标覆盖情况</h3>
        <canvas id="coverageChart"></canvas>
      </div>
      <div class="chart-container">
        <h3>📈 分类分布</h3>
        <canvas id="categoryChart"></canvas>
      </div>
    </div>

    <div class="filter-tabs">
      <div class="filter-tab active" data-filter="all">全部</div>
      <div class="filter-tab" data-filter="has-logo">已有台标</div>
      <div class="filter-tab" data-filter="no-logo">暂无台标</div>
    </div>

    <input type="text" class="search-box" id="searchInput" placeholder="搜索电台名称...">

    <div class="channel-grid" id="channelGrid"></div>
  </div>

  <div class="modal" id="detailModal">
    <div class="modal-content">
      <h3>电台详情</h3>
      <div class="detail-icon" id="detailIcon"></div>
      <div class="detail-row">
        <span class="detail-label">名称</span>
        <span class="detail-value" id="detailName"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">频率</span>
        <span class="detail-value" id="detailFreq"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">地区</span>
        <span class="detail-value" id="detailRegion"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">分类</span>
        <span class="detail-value" id="detailCategory"></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">台标状态</span>
        <span class="detail-value" id="detailLogoStatus"></span>
      </div>
      <button class="close-btn" id="closeModal">关闭</button>
    </div>
  </div>

  <script>
    let channels = [];
    let currentFilter = 'all';
    let searchQuery = '';

    async function loadChannels() {
      try {
        const response = await fetch('mobile/www/channels.js');
        const content = await response.text();
        const start = content.indexOf('{');
        const end = content.lastIndexOf('}') + 1;
        const jsonStr = content.substring(start, end);
        const data = JSON.parse(jsonStr);
        channels = data.radio || [];
        renderStats();
        renderCharts();
        renderChannels();
      } catch (error) {
        console.error('加载频道数据失败:', error);
      }
    }

    function renderStats() {
      const total = channels.length;
      const hasLogo = channels.filter(ch => ch.logo).length;
      const noLogo = total - hasLogo;
      const coverage = total > 0 ? (hasLogo / total * 100).toFixed(1) : '0';

      document.getElementById('totalCount').textContent = total;
      document.getElementById('hasLogoCount').textContent = hasLogo;
      document.getElementById('noLogoCount').textContent = noLogo;
      document.getElementById('coveragePercent').textContent = coverage + '%';
      document.getElementById('progressFill').style.width = coverage + '%';
    }

    function renderCharts() {
      const hasLogo = channels.filter(ch => ch.logo).length;
      const noLogo = channels.length - hasLogo;

      new Chart(document.getElementById('coverageChart'), {
        type: 'doughnut',
        data: {
          labels: ['已有台标', '暂无台标'],
          datasets: [{
            data: [hasLogo, noLogo],
            backgroundColor: ['#2ecc71', '#e74c3c'],
            borderWidth: 0,
            hoverOffset: 10
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: { color: '#fff', padding: 20, font: { size: 14 } }
            }
          }
        }
      });

      const categories = {};
      channels.forEach(ch => {
        const cat = ch.category || '未分类';
        categories[cat] = (categories[cat] || 0) + 1;
      });

      const sortedCats = Object.entries(categories).sort((a, b) => b[1] - a[1]).slice(0, 10);

      new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
          labels: sortedCats.map(c => c[0]),
          datasets: [{
            label: '电台数量',
            data: sortedCats.map(c => c[1]),
            backgroundColor: 'rgba(0, 212, 255, 0.7)',
            borderColor: 'rgba(0, 212, 255, 1)',
            borderWidth: 1,
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          scales: {
            y: {
              beginAtZero: true,
              ticks: { color: '#aaa' },
              grid: { color: 'rgba(255, 255, 255, 0.1)' }
            },
            x: {
              ticks: { color: '#aaa', autoSkip: true, maxRotation: 45, minRotation: 0 },
              grid: { display: false }
            }
          },
          plugins: {
            legend: { display: false }
          }
        }
      });
    }

    function generateSvgLogo(name, cat, freq, color) {
      const nameStr = name || '';
      let firstChar = '';
      for (let i = 0; i < nameStr.length; i++) {
        const ch = nameStr[i];
        if (/[\u4e00-\u9fa5a-zA-Z0-9]/.test(ch)) {
          firstChar = ch;
          break;
        }
      }
      if (!firstChar) firstChar = '电';

      let subText = '';
      const fmMatch = freq ? freq.match(/FM\d+\.?\d*/i) : null;
      const amMatch = freq ? freq.match(/AM\d+/i) : null;
      if (fmMatch) {
        subText = fmMatch[0].toUpperCase();
      } else if (amMatch) {
        subText = amMatch[0].toUpperCase();
      } else if (cat) {
        subText = cat;
      }
      if (subText.length > 6) subText = subText.substring(0, 6);

      const categoryColors = {
        '新闻': { from: '#e74c3c', to: '#c0392b' },
        '资讯': { from: '#e74c3c', to: '#c0392b' },
        '音乐': { from: '#9b59b6', to: '#8e44ad' },
        '影视': { from: '#e67e22', to: '#d35400' },
        '经济': { from: '#f39c12', to: '#d68910' },
        '交通': { from: '#3498db', to: '#2980b9' },
        '体育': { from: '#27ae60', to: '#1e8449' },
        '文艺': { from: '#e67e22', to: '#d35400' },
        '生活': { from: '#1abc9c', to: '#16a085' },
        '综合': { from: '#7f8c8d', to: '#6c7a7a' }
      };

      let gradient = { from: color || '#e74c3c', to: adjustColor(color || '#e74c3c', -20) };
      const catStr = (cat || '').toLowerCase();
      for (const [key, colors] of Object.entries(categoryColors)) {
        if (catStr.includes(key)) {
          gradient = colors;
          break;
        }
      }

      const fontSize = firstChar.match(/[a-zA-Z0-9]/) ? 26 : 22;
      const subFontSize = subText.length > 4 ? 8 : 10;
      const randId = Math.random().toString(36).substr(2, 9);

      return `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="60" height="60">
          <defs>
            <linearGradient id="grad_${randId}" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:${gradient.from};stop-opacity:1" />
              <stop offset="100%" style="stop-color:${gradient.to};stop-opacity:1" />
            </linearGradient>
            <radialGradient id="glow_${randId}" cx="35%" cy="35%" r="60%" fx="35%" fy="35%">
              <stop offset="0%" style="stop-color:rgba(255,255,255,0.3);stop-opacity:1" />
              <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:1" />
            </radialGradient>
            <filter id="shadow_${randId}" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="rgba(0,0,0,0.2)" />
            </filter>
          </defs>
          <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#grad_${randId})" filter="url(#shadow_${randId})" />
          <rect x="2" y="2" width="44" height="44" rx="10" fill="url(#glow_${randId})" />
          <circle cx="38" cy="10" r="3" fill="rgba(255,255,255,0.6)" />
          <circle cx="35" cy="14" r="2" fill="rgba(255,255,255,0.4)" />
          <circle cx="41" cy="14" r="2" fill="rgba(255,255,255,0.4)" />
          <text x="24" y="${subText ? 24 : 28}" text-anchor="middle" fill="white" font-size="${fontSize}" font-weight="bold" font-family="Microsoft YaHei, PingFang SC, sans-serif">${firstChar}</text>
          ${subText ? `<text x="24" y="${subText.length > 4 ? 37 : 38}" text-anchor="middle" fill="rgba(255,255,255,0.95)" font-size="${subFontSize}" font-weight="500" font-family="Microsoft YaHei, PingFang SC, sans-serif">${subText}</text>` : ''}
          <path d="M8 40 L12 36 L16 40 L20 36 L24 40" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" fill="none" stroke-linecap="round" />
        </svg>
      `;
    }

    function adjustColor(hex, amount) {
      const num = parseInt(hex.replace('#', ''), 16);
      const r = Math.max(0, Math.min(255, (num >> 16) + amount));
      const g = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amount));
      const b = Math.max(0, Math.min(255, (num & 0x0000FF) + amount));
      return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
    }

    function renderChannels() {
      const grid = document.getElementById('channelGrid');
      grid.innerHTML = '';

      const filtered = channels.filter(ch => {
        const matchFilter = currentFilter === 'all' ||
          (currentFilter === 'has-logo' && ch.logo) ||
          (currentFilter === 'no-logo' && !ch.logo);
        const matchSearch = !searchQuery || 
          ch.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchFilter && matchSearch;
      });

      filtered.forEach(ch => {
        const card = document.createElement('div');
        card.className = `channel-card ${ch.logo ? 'has-logo' : 'no-logo'}`;
        card.onclick = () => showDetail(ch);

        const icon = document.createElement('div');
        icon.className = 'channel-icon';
        
        if (ch.logo) {
          const img = document.createElement('img');
          img.src = ch.logo;
          img.onerror = () => {
            icon.innerHTML = generateSvgLogo(ch.name, ch.category, ch.frequency, ch.color);
          };
          icon.appendChild(img);
        } else {
          icon.innerHTML = generateSvgLogo(ch.name, ch.category, ch.frequency, ch.color);
        }

        const name = document.createElement('div');
        name.className = 'channel-name';
        name.textContent = ch.name;

        const freq = document.createElement('div');
        freq.className = 'channel-freq';
        freq.textContent = ch.frequency || '网络电台';

        card.appendChild(icon);
        card.appendChild(name);
        card.appendChild(freq);
        grid.appendChild(card);
      });
    }

    function showDetail(ch) {
      const modal = document.getElementById('detailModal');
      const icon = document.getElementById('detailIcon');
      
      if (ch.logo) {
        const img = document.createElement('img');
        img.src = ch.logo;
        img.onerror = () => {
          icon.innerHTML = generateSvgLogo(ch.name, ch.category, ch.frequency, ch.color);
        };
        icon.innerHTML = '';
        icon.appendChild(img);
      } else {
        icon.innerHTML = generateSvgLogo(ch.name, ch.category, ch.frequency, ch.color);
      }

      document.getElementById('detailName').textContent = ch.name;
      document.getElementById('detailFreq').textContent = ch.frequency || '网络电台';
      document.getElementById('detailRegion').textContent = ch.description || '未知';
      document.getElementById('detailCategory').textContent = ch.category || '未分类';
      document.getElementById('detailLogoStatus').textContent = ch.logo ? '✓ 已有台标' : '✗ 暂无台标';
      document.getElementById('detailLogoStatus').style.color = ch.logo ? '#2ecc71' : '#e74c3c';

      modal.classList.add('active');
    }

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentFilter = tab.dataset.filter;
        renderChannels();
      });
    });

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderChannels();
    });

    document.getElementById('closeModal').addEventListener('click', () => {
      document.getElementById('detailModal').classList.remove('active');
    });

    document.getElementById('detailModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('detailModal')) {
        document.getElementById('detailModal').classList.remove('active');
      }
    });

    loadChannels();
  </script>
</body>
</html>
